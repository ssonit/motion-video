<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2a1409"/>
      <stop offset="1" stop-color="#090504"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3b44"/>
      <stop offset=".5" stop-color="#1d1d24"/>
      <stop offset="1" stop-color="#0e0e12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ff4d0d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0607"/>
      <stop offset="1" stop-color="#190c08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="520" r="430" fill="url(#glow)"/>

  <!-- neck / base -->
  <rect x="452" y="760" width="120" height="60" rx="18" fill="#17171c"/>
  <rect x="452" y="760" width="120" height="14" fill="#ff7a1f" opacity=".8"/>
  <path d="M330 850 Q512 790 694 850" fill="none" stroke="url(#rim)" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="512" cy="900" rx="210" ry="22" fill="#000" opacity=".5" filter="url(#blur2)"/>

  <!-- antenna: small blade, not a ball -->
  <path d="M512 180 L512 120" stroke="#ff7a1f" stroke-width="10" stroke-linecap="round"/>
  <path d="M512 92 L526 120 L498 120 Z" fill="#ffd08a"/>

  <!-- head shell (squircle, no ears) -->
  <rect x="215" y="180" width="594" height="590" rx="210" fill="#ff6a1a" opacity=".35" filter="url(#blur)"/>
  <rect x="215" y="180" width="594" height="590" rx="210" fill="url(#shell)"/>
  <rect x="215" y="180" width="594" height="590" rx="210" fill="none" stroke="url(#rim)" stroke-width="10"/>

  <!-- screen -->
  <rect x="268" y="320" width="488" height="330" rx="120" fill="url(#screen)"/>
  <rect x="268" y="320" width="488" height="330" rx="120" fill="none" stroke="#ff7a1f" stroke-opacity=".35" stroke-width="3"/>

  <!-- scanlines -->
  <g stroke="#ff7a1f" stroke-opacity=".06" stroke-width="2">
    <line x1="290" y1="360" x2="734" y2="360"/><line x1="290" y1="400" x2="734" y2="400"/>
    <line x1="290" y1="440" x2="734" y2="440"/><line x1="290" y1="480" x2="734" y2="480"/>
    <line x1="290" y1="520" x2="734" y2="520"/><line x1="290" y1="560" x2="734" y2="560"/>
    <line x1="290" y1="600" x2="734" y2="600"/>
  </g>

  <!-- eyes: glowing rounded bars, slight happy tilt -->
  <g filter="url(#blur2)" opacity=".9">
    <rect x="362" y="420" width="86" height="120" rx="43" fill="#ff7a1f"/>
    <rect x="576" y="420" width="86" height="120" rx="43" fill="#ff7a1f"/>
  </g>
  <rect x="362" y="420" width="86" height="120" rx="43" fill="#ffd9a8"/>
  <rect x="576" y="420" width="86" height="120" rx="43" fill="#ffd9a8"/>
  <rect x="378" y="436" width="22" height="34" rx="11" fill="#fff" opacity=".8"/>
  <rect x="592" y="436" width="22" height="34" rx="11" fill="#fff" opacity=".8"/>

  <!-- tiny mouth -->
  <path d="M474 590 Q512 618 550 590" fill="none" stroke="#ffb066" stroke-width="10" stroke-linecap="round"/>

  <!-- side accent lights (not ears) -->
  <rect x="226" y="440" width="10" height="90" rx="5" fill="#ff7a1f"/>
  <rect x="788" y="440" width="10" height="90" rx="5" fill="#ff7a1f"/>

  <!-- shell highlight -->
  <path d="M290 250 Q340 205 460 200" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="10" stroke-linecap="round"/>
</svg>
