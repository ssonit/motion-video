<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#3a1a0c"/>
      <stop offset="1" stop-color="#0d0705"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#ff6a1a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1a14"/>
      <stop offset="1" stop-color="#120a07"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7a1f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="420" fill="url(#glow)"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="905" rx="230" ry="28" fill="#000" opacity=".45" filter="url(#soft)"/>

  <!-- antenna -->
  <line x1="512" y1="215" x2="512" y2="145" stroke="#ffb066" stroke-width="14" stroke-linecap="round"/>
  <circle cx="512" cy="128" r="30" fill="#ffe3b0"/>
  <circle cx="512" cy="128" r="46" fill="#ffd08a" opacity=".3"/>

  <!-- arms -->
  <path d="M300 640 C 215 650, 190 720, 235 760" fill="none" stroke="#ff8a3d" stroke-width="42" stroke-linecap="round"/>
  <path d="M724 620 C 800 560, 840 470, 815 400" fill="none" stroke="#ff8a3d" stroke-width="42" stroke-linecap="round"/>
  <circle cx="237" cy="765" r="40" fill="#ffb066"/>
  <circle cx="815" cy="392" r="44" fill="#ffb066"/>

  <!-- feet -->
  <ellipse cx="420" cy="878" rx="70" ry="34" fill="#c4480c"/>
  <ellipse cx="604" cy="878" rx="70" ry="34" fill="#c4480c"/>

  <!-- body -->
  <rect x="352" y="610" width="320" height="260" rx="120" fill="url(#body)"/>
  <circle cx="512" cy="740" r="38" fill="#2b1a14"/>
  <circle cx="512" cy="740" r="22" fill="#ffe3b0"/>

  <!-- head -->
  <rect x="222" y="210" width="580" height="450" rx="190" fill="url(#body)"/>
  <rect x="222" y="210" width="580" height="450" rx="190" fill="none" stroke="#ffd2a1" stroke-width="6" opacity=".6"/>
  <!-- ear pods -->
  <rect x="180" y="380" width="60" height="130" rx="30" fill="#c4480c"/>
  <rect x="784" y="380" width="60" height="130" rx="30" fill="#c4480c"/>

  <!-- face screen -->
  <rect x="290" y="275" width="444" height="320" rx="140" fill="url(#face)"/>
  <rect x="290" y="275" width="444" height="320" rx="140" fill="none" stroke="#ff8a3d" stroke-width="5" opacity=".7"/>

  <!-- eyes -->
  <ellipse cx="415" cy="425" rx="52" ry="64" fill="#ffd9a8"/>
  <ellipse cx="609" cy="425" rx="52" ry="64" fill="#ffd9a8"/>
  <ellipse cx="428" cy="440" rx="26" ry="34" fill="#2b1a14"/>
  <ellipse cx="622" cy="440" rx="26" ry="34" fill="#2b1a14"/>
  <circle cx="440" cy="420" r="13" fill="#fff"/>
  <circle cx="634" cy="420" r="13" fill="#fff"/>

  <!-- smile -->
  <path d="M440 520 Q512 580 584 520" fill="none" stroke="#ffb066" stroke-width="16" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="350" cy="510" rx="30" ry="16" fill="#ff5a1f" opacity=".55"/>
  <ellipse cx="674" cy="510" rx="30" ry="16" fill="#ff5a1f" opacity=".55"/>

  <!-- head highlight -->
  <path d="M290 300 Q330 235 440 228" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".45"/>
</svg>
