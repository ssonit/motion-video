<html lang="en" data-composition-variables='[

  {"id":"hookLine","type":"string","label":"Hook line","default":"Hand it over tonight.","group":"Hook"},
  {"id":"pillText","type":"string","label":"Pill text","default":"Sending to Chief…","group":"Hook"},
  {"id":"gridTitle","type":"string","label":"Grid title","default":"Eight agents. One Chief.","group":"Grid"},
  {"id":"morningLine","type":"string","label":"Statement","default":"Wake up to finished work.","group":"Ending"},

<head>

<style id="om-fonts">

@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC-800.woff") format("woff"); font-weight: 800; font-style: normal; }

<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0A101C; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0A101C; color: #fff;
          font-family: "Noto Sans SC", sans-serif; font-weight: 700; }
  .abs { position: absolute; }
  .full { position: absolute; inset: 0; }

  /* ---------- hook: blurred late-night desktop ---------- */
  #s-hook { background: radial-gradient(1400px 800px at 70% 20%, #1C3358, #0A101C 70%); }
  .win { position: absolute; border-radius: 26px; background: linear-gradient(180deg,#27406B,#162844); filter: blur(10px); opacity: .85; }
  .win i { position: absolute; left: 36px; right: 36px; height: 16px; border-radius: 8px; background: #ffffff30; }
  .clock-top { left: 120px; top: 90px; font-size: 56px; font-weight: 800; letter-spacing: 2px; color: #FFB454; }
  .hook-line { left: 120px; top: 190px; font-size: 140px; font-weight: 900; letter-spacing: -4px; line-height: 1.02; width: 1100px; }
  .hook-line .m { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 12px; }
  .hook-line .c { display: inline-block; }

  /* ---------- the pill that stays put ---------- */
  #pill { position: absolute; left: 960px; top: 560px; z-index: 50; display: flex; align-items: center; gap: 26px;
          background: #fff; color: #111; border-radius: 999px; padding: 30px 62px 30px 38px; font-size: 54px; font-weight: 800;
          box-shadow: 0 30px 70px #00000055; white-space: nowrap; }
  #pill .dot { width: 64px; height: 64px; border-radius: 50%; background: #54B8A5; position: relative; }
  #pill .dot::after { content: ""; position: absolute; left: 30px; top: 12px; width: 6px; height: 22px; border-radius: 3px; background: #fff; transform-origin: 50% 100%; }
  #pill .dot b { position: absolute; inset: 0; }

  /* ---------- agent pages ---------- */
  .page { position: absolute; inset: 0; clip-path: inset(100% 0 0 0); }
  .page .no { position: absolute; left: 70px; top: 50px; font-size: 26px; font-weight: 700; letter-spacing: 3px; opacity: .6; }
  .page .name { position: absolute; left: 70px; bottom: 70px; font-size: 170px; font-weight: 800; letter-spacing: -5px; line-height: 1; white-space: nowrap; }
  .page .name .m { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 14px; }
  .page .name .c { display: inline-block; }
  .eye { position: absolute; background: #fff; border-radius: 160px; }

  /* ---------- grid ---------- */
  #s-grid { background: #0A101C; }
  .gtitle { left: 90px; top: 60px; font-size: 76px; font-weight: 900; letter-spacing: -2px; }
  .tile { position: absolute; width: 400px; height: 360px; border-radius: 34px; overflow: hidden; }
  .tile .tn { position: absolute; left: 26px; bottom: 22px; font-size: 38px; font-weight: 800; letter-spacing: -1px; }
  .tile .te { position: absolute; background: currentColor; opacity: .95; border-radius: 99px; }

  /* ---------- morning lock screen ---------- */
  #s-morning { background: linear-gradient(180deg,#05070F 0%,#0E1A33 55%,#25324E 100%); }
  .star { position: absolute; border-radius: 50%; background: #fff; }
  .mtn { left: 0; bottom: 0; width: 1920px; height: 420px; }
  .lock-clock { left: 0; width: 1920px; top: 70px; text-align: center; font-size: 330px; font-weight: 800; letter-spacing: -8px; font-variant-numeric: tabular-nums; line-height: 1; }
  .lock-sub { left: 0; width: 1920px; top: 410px; text-align: center; font-size: 40px; font-weight: 700; opacity: .75; letter-spacing: 2px; }
  .note { position: absolute; width: 560px; height: 112px; border-radius: 26px; background: #ffffffEE; color: #111;
          display: flex; align-items: center; gap: 22px; padding: 0 26px; box-sizing: border-box; box-shadow: 0 18px 40px #00000066; }
  .note .nd { width: 56px; height: 56px; border-radius: 16px; flex: none; }
  .note .nt { font-size: 30px; font-weight: 800; line-height: 1.12; }
  .note .ns { font-size: 25px; font-weight: 700; color: #555; }

  /* ---------- statement ---------- */
  #s-line { background: #F4EFE6; color: #111; }
  .line-t { left: 120px; top: 330px; width: 1700px; font-size: 190px; font-weight: 900; letter-spacing: -6px; line-height: 1.02; }
  .line-t .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 16px; margin-right: 34px; position: relative; }
  .line-t .w span { display: inline-block; position: relative; z-index: 1; }
  .hl { position: absolute; left: -10px; right: -10px; bottom: 26px; height: 74px; background: #FFD23F; transform-origin: 0 50%; z-index: 0; }

  /* ---------- end ---------- */
  #s-end { background: #0A101C; }
  .end-t { left: 160px; width: 1600px; top: 350px; text-align: center; font-size: 98px; line-height: 1.1; font-weight: 900; letter-spacing: -3px; }
  .end-n { left: 0; width: 1920px; top: 640px; text-align: center; font-size: 30px; font-weight: 700; opacity: .6; letter-spacing: 2px; }
</style>

  Fan-made 30 s "overnight" film in the style of the Grok Bot clip in the huashu-motion README (not official).
  Beat grid: 120 BPM (1 beat = .5 s). Scenes: hook 0 · agents 3.5 · grid 13.5 · morning 17.5 · line 25 · end 28.
-->
<div id="film" data-composition-id="film" data-width="1920" data-height="1080">
  <audio id="om-sound" src="assets/sound.wav" data-start="0" data-duration="30.51" data-track-index="8" data-volume="1"></audio>

  <section id="s-hook" class="full">
    <div class="win" style="left:150px;top:300px;width:900px;height:560px" data-layout-allow-overflow><i style="top:70px"></i><i style="top:120px;right:260px"></i><i style="top:170px"></i><i style="top:220px;right:380px"></i><i style="top:270px"></i></div>
    <div class="win" style="left:1180px;top:340px;width:560px;height:420px" data-layout-allow-overflow><i style="top:70px"></i><i style="top:120px;right:140px"></i></div>
    <div class="abs clock-top" data-om-id="hook-time" data-var-text="hookTime">11:42 PM</div>

  <section id="s-agents" class="full"></section>

    <svg class="abs mtn" viewBox="0 0 1920 420" data-layout-allow-overflow><polygon points="0,420 0,250 260,120 480,230 760,60 1080,240 1340,110 1620,230 1920,150 1920,420" fill="#0B1222"/><polygon points="0,420 0,330 340,240 640,320 980,230 1320,330 1640,260 1920,330 1920,420" fill="#070C18"/></svg>
  </section>

  <section id="s-line" class="full">
    <div class="abs line-t" id="lineT" data-om-id="statement"></div>

    <div class="abs end-n" data-om-id="end-note" data-var-text="endNote">Fan-made film · unofficial · illustrative numbers</div>
  </section>

  <div id="pill" data-om-id="pill" data-layout-allow-occlusion><span class="dot"><b></b></span><span id="pillText" data-var-text="pillText">Sending to Chief…</span></div>
</div>

<script>
  const V = OM.vars();
  const B = (n) => n * 0.5;                 // 120 BPM
  const rnd = OM.random(11);
  const esc = (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c] || c;
  const split = (txt, cls = 'm', inner = 'c') => [...txt].map((c) => c === ' ' ? ' ' : `<span class="${cls}"><span class="${inner}">${esc(c)}</span></span>`).join('');

  /* ---------- agents ---------- */
  const AGENTS = [
    { n: 'Sales Outbound',      bg: '#EF9F37', fg: '#111', side: 'left'  },
    { n: 'Talent Scout',        bg: '#3B7BF0', fg: '#fff', side: 'right' },
    { n: 'Paid Media',          bg: '#8B5CF6', fg: '#fff', side: 'left'  },
    { n: 'Expense Manager',     bg: '#EA6B2A', fg: '#fff', side: 'right' },
    { n: 'Product Performance', bg: '#6366F1', fg: '#fff', side: 'left'  },
    { n: 'Bug Reproduction',    bg: '#121212', fg: '#fff', side: 'right' },
    { n: 'Account Health',      bg: '#EFEDE8', fg: '#111', side: 'left'  },
    { n: 'Chief of Staff',      bg: '#54B8A5', fg: '#111', side: 'right' },
  ];
  const NOTES = [
    ['Sales Outbound', '14 leads qualified', 0], ['Talent Scout', '3 candidates shortlisted', 1],
    ['Paid Media', 'Budget moved to winners', 2], ['Expense Manager', '27 receipts filed', 3],
    ['Product Performance', 'Weekly report ready', 4], ['Bug Reproduction', '2 bugs reproduced', 5],
    ['Account Health', '5 accounts flagged', 6], ['Chief of Staff', 'Your morning brief', 7],
  ];

  const agents = document.getElementById('s-agents');
  AGENTS.forEach((a, i) => {
    const d = document.createElement('div');
    d.className = 'page'; d.id = 'pg' + i; d.dataset.omId = 'agent-' + (i + 1);
    d.style.background = a.bg; d.style.color = a.fg;
    const L = a.side === 'left';
    d.innerHTML =
      `<div class="no">0${i + 1} / 08</div>` +
      `<div class="eye" id="e${i}a" style="width:150px;height:330px;left:${L ? 230 : 1330}px;top:${L ? 130 : 110}px;transform:rotate(${L ? 22 : -24}deg)"></div>` +
      `<div class="eye" id="e${i}b" style="width:150px;height:330px;left:${L ? 520 : 1590}px;top:${L ? 70 : 170}px;transform:rotate(${L ? -26 : 22}deg)"></div>` +
      `<div class="name" id="nm${i}">${split(a.n)}</div>`;
    agents.appendChild(d);
  });

  /* ---------- grid tiles ---------- */
  const grid = document.getElementById('s-grid');
  AGENTS.forEach((a, i) => {
    const t = document.createElement('div');
    t.className = 'tile'; t.id = 'tl' + i; t.dataset.omId = 'tile-' + (i + 1);
    const col = i % 4, row = Math.floor(i / 4);
    t.style.left = (80 + col * 440) + 'px'; t.style.top = (190 + row * 400) + 'px';
    t.style.background = a.bg; t.style.color = a.fg;
    t.innerHTML = `<div class="te" style="width:44px;height:100px;left:${i % 2 ? 230 : 90}px;top:48px;transform:rotate(${i % 2 ? -22 : 20}deg)"></div>` +
                  `<div class="te" style="width:44px;height:100px;left:${i % 2 ? 300 : 160}px;top:${i % 2 ? 24 : 70}px;transform:rotate(${i % 2 ? 22 : -24}deg)"></div>` +
                  `<div class="tn">${a.n}</div>`;
    grid.appendChild(t);
  });

  /* ---------- lock screen: stars + notifications ---------- */
  const morning = document.getElementById('s-morning');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const z = 2 + Math.floor(rnd() * 3);
    s.style.cssText = `left:${Math.floor(rnd() * 1900)}px;top:${Math.floor(rnd() * 600)}px;width:${z}px;height:${z}px;opacity:${(0.3 + rnd() * 0.6).toFixed(2)}`;
    morning.appendChild(s);
  }
  const POS = [[230, 510], [1090, 540], [290, 650], [1050, 680], [230, 790], [1090, 820], [290, 930], [1050, 960]];
  NOTES.forEach(([t, s, k], i) => {
    const n = document.createElement('div'); n.className = 'note'; n.id = 'nt' + i; n.dataset.omId = 'note-' + (i + 1);
    n.style.left = POS[i][0] + 'px'; n.style.top = POS[i][1] + 'px';
    n.innerHTML = `<div class="nd" style="background:${AGENTS[k].bg};${AGENTS[k].bg === '#EFEDE8' ? 'border:2px solid #ccc' : ''}"></div><div><div class="nt">${t}</div><div class="ns">${s}</div></div>`;
    morning.appendChild(n);
  });

  /* ---------- statement ---------- */
  const key = V.morningKey.trim().toLowerCase();
  document.getElementById('lineT').innerHTML = V.morningLine.split(' ').map((w) => {
    const hit = key && w.replace(/[^\w]/g, '').toLowerCase() === key;
    return `<span class="w">${hit ? '<i class="hl"></i>' : ''}<span>${esc(w)}</span></span>`;
  }).join('');
  document.getElementById('hookLine').innerHTML = V.hookLine.split(' ').map((w) => `<span style="display:inline-block;margin-right:36px">${split(w)}</span>`).join('');

  /* ================================================================ timeline */
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const pill = '#pill';
  gsap.set(pill, { xPercent: -50, yPercent: -50 });
  gsap.set('#s-agents, #s-grid, #s-morning, #s-line, #s-end', { opacity: 0 });

  /* --- hook 0–3.5: frame 0 already has the pill, big --- */
  tl.addLabel('scene:hook', 0)
    .fromTo(pill, { scale: 1.9, y: 230, rotation: -2 }, { scale: 1.45, y: 170, rotation: 0, duration: 1.6, ease: 'expo.out' }, 0)
    .fromTo('.win', { y: 60, opacity: 0 }, { y: 0, opacity: .85, duration: .9, stagger: .12 }, 0)
    .fromTo('.clock-top', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .5 }, .15)
    .fromTo('#hookLine .c', { yPercent: 115 }, { yPercent: 0, duration: .8, stagger: .03, ease: 'expo.out' }, B(1))
    .to(pill, { y: 0, scale: 1.0, duration: .6, ease: 'power3.inOut' }, B(5.5))
    .to('#s-hook .win, #hookLine, .clock-top', { opacity: 0, duration: .25 }, B(7.4));
  tl.fromTo('#s-hook .win', { scale: 1 }, { scale: 1.12, duration: 3.4, ease: 'none' }, 0)
    .to(pill, { scale: '+=0.1', duration: .12, yoyo: true, repeat: 1, ease: 'power2.out' }, B(2))
    .to(pill, { scale: '+=0.1', duration: .12, yoyo: true, repeat: 1, ease: 'power2.out' }, B(3))
    .to(pill, { scale: '+=0.1', duration: .12, yoyo: true, repeat: 1, ease: 'power2.out' }, B(4))
    .fromTo('.clock-top', { letterSpacing: '2px' }, { letterSpacing: '10px', duration: 3, ease: 'none' }, .6);
  OM.sfx('thud', B(2), { gain: .5 }); OM.sfx('thud', B(3), { gain: .5 }); OM.sfx('tick', B(4), { gain: .6 });
  OM.sfx('impact', 0.05);
  OM.sfx('whoosh', B(1) - .1, { gain: .6 });
  OM.sfx('riser', B(7.9), { gain: .6 });

  /* --- agents 3.5–13.5: eight colour pages, the pill never moves --- */
  const T0 = B(8), H = V.pageHold;
  tl.addLabel('scene:agents', T0);
  tl.set('#s-agents', { opacity: 1 }, T0 - .01);
  tl.set(pill, { y: 0 }, T0);
  AGENTS.forEach((a, i) => {
    const t = T0 + i * H;
    tl.fromTo('#pg' + i, { clipPath: 'inset(100% 0 0 0)' }, { clipPath: 'inset(0% 0 0 0)', duration: .35, ease: 'power4.inOut' }, t - .15)
      .fromTo(`#e${i}a`, { scale: 0, y: 80 }, { scale: 1, y: 0, duration: .5, ease: 'back.out(2.2)' }, t + .12)
      .fromTo(`#e${i}b`, { scale: 0, y: 80 }, { scale: 1, y: 0, duration: .5, ease: 'back.out(2.2)' }, t + .2)
      .fromTo(`#nm${i} .c`, { yPercent: 110 }, { yPercent: 0, duration: .55, stagger: .018, ease: 'expo.out' }, t + .1)
      .fromTo(`#pg${i} .no`, { opacity: 0 }, { opacity: .6, duration: .3 }, t + .1)
      .to(`#e${i}a, #e${i}b`, { scaleY: .12, duration: .08, yoyo: true, repeat: 1, ease: 'power1.inOut' }, t + H * .62)
      .to(`#e${i}a`, { y: -22, duration: .5, ease: 'sine.inOut' }, t + .5)
      .to(`#e${i}b`, { y: 22, duration: .5, ease: 'sine.inOut' }, t + .5);
    tl.to(pill, { scale: 1.07, duration: .12, yoyo: true, repeat: 1, ease: 'power2.out' }, t + .12);
    OM.sfx('whoosh', t - .2, { gain: .5, pan: i % 2 ? .4 : -.4 });
    OM.sfx('pop', t + .22, { note: i + 1, gain: .8 });
    OM.sfx('thud', t + .12, { gain: .55 });
  });

  /* --- grid 13.5–17.5 --- */
  const G0 = T0 + 8 * H;
  tl.addLabel('scene:grid', G0);
  tl.set('#s-grid', { opacity: 1 }, G0 - .01)
    .fromTo('#s-grid', { clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)', duration: .35, ease: 'power4.inOut' }, G0 - .1)
    .fromTo('.gtitle', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .5 }, G0 + .1)
    .fromTo('.tile', { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .45, stagger: .08, ease: 'back.out(1.6)' }, G0 + .1)
    .to(pill, { x: 660, y: 150, scale: .62, duration: .6, ease: 'expo.inOut' }, G0 + 1.3)
    .to('.tile', { scale: .96, duration: .15, stagger: .03, yoyo: true, repeat: 1 }, G0 + 1.9)
    .to(pill, { opacity: 0, duration: .25 }, G0 + 2.3)
    .to('#s-grid', { opacity: 0, duration: .25 }, G0 + 3.7);
  tl.fromTo('#s-grid', { scale: 1 }, { scale: 1.05, duration: 1.8, ease: 'none' }, G0 + 1.9)
    .to('.tile', { y: -12, duration: .9, ease: 'sine.inOut', yoyo: true, repeat: 1, stagger: .06 }, G0 + 1.9);
  AGENTS.forEach((_, i) => OM.sfx('tick', G0 + .15 + i * .08, { note: i + 1, gain: .6 }));
  OM.sfx('whoosh', G0 - .2, { gain: .6 });
  OM.sfx('boing', G0 + 1.5, { gain: .5 });

  /* --- morning 17.5–25: clock runs through the night, reports land at 06:59 --- */
  const M0 = G0 + 4;
  tl.addLabel('scene:morning', M0);
  const clock = { m: 23 * 60 + 42 };
  const fmt = (m) => { m = Math.round(m) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  tl.set('#s-morning', { opacity: 1 }, M0 - .01)
    .fromTo('#s-morning', { opacity: 0 }, { opacity: 1, duration: .35 }, M0 - .1)
    .fromTo('.star', { opacity: 0 }, { opacity: 1, duration: 1.2, stagger: .01 }, M0)
    .fromTo('.lock-clock', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: .6 }, M0 + .05)
    .fromTo('.lock-sub', { opacity: 0 }, { opacity: .75, duration: .5 }, M0 + .3)
    .fromTo(clock, { m: 23 * 60 + 42 }, { m: 24 * 60 + 6 * 60 + 59, duration: 2.6, ease: 'power2.inOut',
        onUpdate: () => { document.getElementById('lockClock').textContent = fmt(clock.m); } }, M0 + .2)
    .fromTo('.mtn', { y: 80 }, { y: 0, duration: 2.8, ease: 'power1.out' }, M0)
    .to('#s-morning', { background: 'linear-gradient(180deg,#27325A 0%,#7A5A8A 55%,#FFB07A 100%)', duration: 2.4, ease: 'power1.inOut' }, M0 + .6);
  NOTES.forEach((_, i) => {
    const t = M0 + 2.9 + i * .3;
    tl.fromTo('#nt' + i, { y: 90, opacity: 0, scale: .85, rotation: i % 2 ? 3 : -3 }, { y: 0, opacity: 1, scale: 1, rotation: 0, duration: .5, ease: 'back.out(1.7)' }, t);
    OM.sfx('ding', t + .2, { note: i + 1, gain: .6 });
  });
  tl.fromTo('#s-morning', { scale: 1 }, { scale: 1.06, duration: 4.2, ease: 'none' }, M0 + 3.6)
    .to('.note', { y: -22, duration: 2.6, ease: 'sine.inOut', stagger: .05 }, M0 + 5.3)
    .to('#s-morning', { opacity: 0, duration: .25 }, M0 + 7.7);
  OM.sfx('whoosh', M0 - .2, { gain: .6 });
  OM.sfx('riser', M0 + 1.2, { gain: .5 });

  /* --- statement 25–28 --- */
  const S0 = M0 + 8;
  tl.addLabel('scene:line', S0);
  tl.set('#s-line', { opacity: 1 }, S0 - .01)
    .fromTo('#s-line', { clipPath: 'inset(0 0 0 100%)' }, { clipPath: 'inset(0 0 0 0%)', duration: .35, ease: 'power4.inOut' }, S0 - .1)
    .fromTo('.line-t .w span', { yPercent: 115 }, { yPercent: 0, duration: .7, stagger: .12, ease: 'expo.out' }, S0 + .1)
    .fromTo('.hl', { scaleX: 0 }, { scaleX: 1, duration: .6, ease: 'expo.out' }, S0 + 1.0)
    .fromTo('.line-t', { x: 0 }, { x: -50, duration: 2.8, ease: 'none' }, S0 + .1)
    .to('#s-line', { opacity: 0, duration: .2 }, S0 + 2.85);
  OM.sfx('impact', S0 + .1, { gain: .8 });
  OM.sfx('draw', S0 + 1.0, { gain: .6 });

  /* --- end 28–30.5 --- */
  const E0 = S0 + 3.0;
  tl.addLabel('scene:end', E0);
  tl.set('#s-end', { opacity: 1 }, E0 - .01)
    .fromTo('.end-t', { opacity: 0, y: 40, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .8, ease: 'expo.out' }, E0 + .05)
    .fromTo('.end-n', { opacity: 0 }, { opacity: .6, duration: .6 }, E0 + .6)
    .fromTo('.end-t', { scale: 1 }, { scale: 1.04, duration: 1.3 + V.endHold, ease: 'none' }, E0 + .2)
    .to({}, { duration: .01 }, E0 + 1.5 + V.endHold);
  OM.sfx('chime', E0 + .2, { gain: .7 });

  window.__timelines['film'] = tl;
</script>
</body>
</html>
