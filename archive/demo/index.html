<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight Crayon Piano</title>
<style>
  html,body{margin:0;height:100%;background:#14121c;overflow:hidden;font-family:"Segoe Print","Comic Sans MS",cursive}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,177.78vh);height:auto;background:#e6d9ba;display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 16px;
      background:linear-gradient(transparent,rgba(0,0,0,.6));color:#f3e9d2;font-size:14px;opacity:.9}
  #ui button{background:#3a2e4a;color:#f3e9d2;border:2px solid #f3e9d2aa;border-radius:8px;padding:4px 12px;font:inherit;cursor:pointer}
  #ui button:hover{background:#51406a}
  #seek{flex:1;accent-color:#e9b45a}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
      background:rgba(10,8,20,.55);color:#f6e8c6;font-size:30px;cursor:pointer;text-align:center}
  #start small{font-size:15px;opacity:.75}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="start"><div>&#9654; Click to play</div><small id="hint">Space = pause · R = replay · ← → = seek · ?t=90 jumps to 1:30</small></div>
<div id="ui">
  <button id="pp">Play</button><button id="rp">Replay</button>
  <input id="seek" type="range" min="0" max="1000" value="0"><span id="tm">0:00</span>
</div>

<script>
(() => {
'use strict';
const W = 1280, H = 720;
const cv = document.getElementById('c'), g = cv.getContext('2d');

/* ------------------------------------------------------------------ MUSIC */
const BPM = 80, SPB = 60 / BPM, BAR = SPB * 4, NB = 40, END = NB * BAR + 4;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const lerp = (a, b, t) => a + (b - a) * t;
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const PROG = ('Am F C G Am F Dm E  Am F C G Am F E Am  C G Am Em F C Dm E  C G Am Em F C Dm E  F G Am C Dm E Am Am').split(/\s+/);
const CD = { Am: [9, 3], F: [5, 4], C: [0, 4], G: [7, 4], Dm: [2, 3], E: [4, 4], Em: [4, 3] };
const EN = [];                         // energy per bar: calm -> building -> climax -> soft ending
for (let b = 0; b < NB; b++) EN[b] = b < 8 ? .18 + .12 * b / 8 : b < 16 ? .38 + .08 * (b - 8) / 8 :
  b < 24 ? .55 + .10 * (b - 16) / 8 : b < 32 ? .72 + .15 * (b - 24) / 8 : b < 36 ? 1 : [.7, .45, .28, .12][b - 36];

const P = [ [[0,1.5],[1.5,.5],[2,2]], [[0,1],[1,1],[2,1],[3,1]],
            [[0,.5],[.5,.5],[1,1],[2,.5],[2.5,.5],[3,1]],
            [[0,.5],[.5,.5],[1,.5],[1.5,.5],[2,.5],[2.5,.5],[3,.5],[3.5,.5]] ];
function patFor(b) {
  if (b < 8) return [0,1,0,1,0,1,1,0][b];
  if (b < 14) return patFor(b - 8);
  if (b < 16) return [1,0][b - 14];
  if (b < 24) return 2;
  if (b < 32) return b % 2 ? 3 : 2;
  if (b < 36) return 3;
  return [1,0,0][b - 36] ?? 0;
}
const N = [];
const rand = rng(7);
const pool = pcs => { const o = []; for (let m = 64; m <= 84; m++) if (pcs.includes(m % 12)) o.push(m); return o; };
const scPool = pool([0,2,4,5,7,9,11]);
let cur = 76; const melody = [];
for (let b = 0; b < NB; b++) {
  const [pc, th] = CD[PROG[b]], t0 = b * BAR, e = EN[b];
  const add = (beat, m, db, v, h) => N.push({ t: t0 + beat * SPB, d: db * SPB, m, v: clamp(v, .12, 1), h });
  const r = 41 + ((pc - 5 + 12) % 12);
  // left hand
  if (b === 39) add(0, 45, 7, .3, 0);
  else if (e < .3) { add(0, r, 2, .3 + e * .3, 0); add(2, r + 7, 2, .24 + e * .3, 0); add(2, r + 12 + th, 2, .22 + e * .3, 0); }
  else if (e < .55) { [0, 7, 12 + th, 7].forEach((o, i) => add(i, r + o, 1, .3 + e * .35, 0)); }
  else { [0, 7, 12, 12 + th, 19, 12 + th, 12, 7].forEach((o, i) => add(i * .5, r + o, .5, .32 + e * .4 + (i % 4 === 0 ? .08 : 0), 0)); }
  // right hand
  if (b === 39) { [69, 72, 76].forEach(m => add(0, m, 7, .32, 1)); continue; }
  const ct = [pc, (pc + th) % 12, (pc + 7) % 12], ctPool = pool(ct);
  if (b >= 8 && b < 14) melody[b] = melody[b - 8];
  else {
    const arr = [];
    for (const [s] of P[patFor(b)]) {
      const strong = s === 0 || s === 2, pl = strong ? ctPool : scPool;
      const target = cur + [-3,-2,-1,-1,0,1,1,2,3][(rand() * 9) | 0] + (72 + 8 * e - cur) * .25;
      let best = pl[0], bd = 1e9;
      for (const c of pl) { const dd = Math.abs(c - target) + (c === cur ? 1.5 : 0); if (dd < bd) { bd = dd; best = c; } }
      cur = best; arr.push(best);
    }
    melody[b] = arr;
  }
  P[patFor(b)].forEach(([s, d], i) => {
    const m = melody[b][i], v = .3 + .55 * e + (s === 0 ? .08 : 0) + rand() * .05;
    add(s, m, d * .95, v, 1);
    if (e >= .95) add(s, m - 12, d * .95, v * .8, 1);
  });
}
N.sort((a, b) => a.t - b.t);
const lowerBound = (arr, t) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].t < t) lo = m + 1; else hi = m; } return lo; };
const upperBound = (arr, t) => { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].t <= t) lo = m + 1; else hi = m; } return lo; };

function energy(T) {
  if (T >= NB * BAR) return EN[NB - 1] * clamp(1 - (T - NB * BAR) / 4, 0, 1);
  const x = T / BAR - .5, i = Math.floor(x), f = smooth(x - i);
  return lerp(EN[clamp(i, 0, NB - 1)], EN[clamp(i + 1, 0, NB - 1)], f);
}

/* ------------------------------------------------------------------ KEYBOARD GEOMETRY */
const KW = 29, KX0 = 263, KY = 568, MIN_M = 41, MAX_M = 84;
const isWhite = m => [0,2,4,5,7,9,11].includes(m % 12);
const KL = {}, KC = {}, WHITES = [], BLACKS = [];
{ let wi = 0; for (let m = MIN_M; m <= MAX_M; m++) if (isWhite(m)) { KL[m] = KX0 + wi * KW; KC[m] = KL[m] + KW / 2; WHITES.push(m); wi++; }
  for (let m = MIN_M; m <= MAX_M; m++) if (!isWhite(m)) { KC[m] = KL[m - 1] + KW; BLACKS.push(m); } }

/* paw trajectories: one list of events per hand */
function handEvents(h) {
  const ev = [];
  for (const n of N) { if (n.h !== h) continue; const l = ev[ev.length - 1];
    if (l && Math.abs(l.t - n.t) < .02) l.xs.push(KC[n.m]); else ev.push({ t: n.t, xs: [KC[n.m]] }); }
  ev.forEach(e => e.x = e.xs.reduce((a, b) => a + b) / e.xs.length);
  return ev;
}
const HE = [handEvents(0), handEvents(1)];
function paw(ev, T, restX) {
  const p = upperBound(ev, T) - 1, nx = p + 1;
  const pX = p >= 0 ? ev[p].x : restX, pT = p >= 0 ? ev[p].t : -9;
  let x = pX, lift = 0, press = p >= 0 ? 1 - clamp((T - pT - .06) / .14, 0, 1) : 0;
  if (nx < ev.length) {
    const nT = ev[nx].t, nX = ev[nx].x;
    const mS = Math.max(pT + Math.min(.16, (nT - pT) * .45), nT - .35);
    const u = clamp((T - mS) / (nT - .02 - mS), 0, 1), s = smooth(u);
    x = pX + (nX - pX) * s;
    lift = Math.min(26, Math.abs(nX - pX) * .14 + 6) * Math.sin(Math.PI * u);
    press = Math.max(press, clamp((T - (nT - .05)) / .05, 0, 1));
  }
  return { x, y: lerp(553 - lift, 577, press), press };
}

/* ------------------------------------------------------------------ AUDIO */
let actx, bus, out, verb, noiseBuf, playing = false, tBase = 0, cBase = 0, idx = 0;
function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
  out = actx.createGain(); out.gain.value = .9; out.connect(comp); comp.connect(actx.destination);
  verb = actx.createConvolver();
  const len = (actx.sampleRate * 2.6) | 0, ir = actx.createBuffer(2, len, actx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); let y = 0;
    for (let i = 0; i < len; i++) { y += ((Math.random() * 2 - 1) - y) * .35; d[i] = y * Math.pow(1 - i / len, 2.6); } }
  verb.buffer = ir; const wet = actx.createGain(); wet.gain.value = .34; verb.connect(wet); wet.connect(out);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  newBus();
}
function newBus() { if (bus) { try { bus.disconnect(); } catch (e) {} } bus = actx.createGain(); bus.gain.value = .55; bus.connect(out); bus.connect(verb); }
const AMPS = [1, .62, .4, .26, .15, .09, .05];
function voice(at, n) {
  const f = 440 * Math.pow(2, (n.m - 69) / 12), v = n.v;
  const ring = Math.max(.9, 3.2 - (n.m - 36) * .04);
  const sum = actx.createGain(), lp = actx.createBiquadFilter(), dm = actx.createGain(), pan = actx.createStereoPanner();
  lp.type = 'lowpass'; lp.frequency.value = 900 + v * 4200 + f * 1.5; lp.Q.value = .3;
  pan.pan.value = clamp((n.m - 62) / 40, -.7, .7) * .8;
  sum.connect(lp); lp.connect(dm); dm.connect(pan); pan.connect(bus);
  const rel = at + n.d + .12;
  dm.gain.setValueAtTime(1, rel); dm.gain.setTargetAtTime(.0001, rel, .4);
  for (let k = 1; k <= 7; k++) {
    const fr = f * k * Math.sqrt(1 + .00035 * k * k); if (fr > 9000) break;
    const o = actx.createOscillator(), gn = actx.createGain(), pk = v * .22 * AMPS[k - 1];
    o.type = 'sine'; o.frequency.value = fr;
    gn.gain.setValueAtTime(0, at); gn.gain.linearRampToValueAtTime(pk, at + .003);
    gn.gain.setTargetAtTime(0, at + .003, ring / (2.5 + k * .9));
    o.connect(gn); gn.connect(sum); o.start(at); o.stop(rel + 3);
  }
  const ns = actx.createBufferSource(), bp = actx.createBiquadFilter(), ng = actx.createGain();   // hammer noise
  ns.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = Math.min(6000, f * 4 + 600); bp.Q.value = .8;
  ng.gain.setValueAtTime(v * .5, at); ng.gain.setTargetAtTime(0, at, .012);
  ns.connect(bp); bp.connect(ng); ng.connect(sum); ns.start(at, Math.random() * .5); ns.stop(at + .12);
}
function getT() { if (!actx || !playing) return tBase; return Math.min(END, tBase + (actx.currentTime - cBase)); }
function pump() {
  if (!playing || !actx) return;
  const T = getT();
  while (idx < N.length && N[idx].t < T + 1.8) {
    const n = N[idx++], at = cBase + (n.t - tBase);
    if (at >= actx.currentTime - .08) voice(Math.max(at, actx.currentTime + .01), n);
  }
}
setInterval(pump, 80);
function seek(t) {
  t = clamp(t, 0, END); tBase = t;
  if (actx) { cBase = actx.currentTime; newBus(); }
  idx = lowerBound(N, t - .0001);
}
async function play() {
  if (!actx) initAudio();
  if (tBase >= END - .05) tBase = 0;
  await actx.resume(); cBase = actx.currentTime; playing = true; idx = lowerBound(N, tBase - .0001);
  document.getElementById('start').style.display = 'none'; ppBtn.textContent = 'Pause';
}
function pause() { if (!playing) return; tBase = getT(); playing = false; actx.suspend(); ppBtn.textContent = 'Play'; }
const toggle = () => playing ? pause() : play();

/* ------------------------------------------------------------------ CRAYON DRAWING KIT */
let boil = 0, SC = 0;
const hh = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };
const wob = (i, k) => hh(i * 7.13 + k * 3.77 + boil * 19.31) - .5;
function trace(c, pts, closed) {
  const n = pts.length; c.beginPath();
  if (closed) { c.moveTo((pts[n-1][0] + pts[0][0]) / 2, (pts[n-1][1] + pts[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    c.closePath(); }
  else { c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = pts[i], q = pts[i + 1]; c.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    c.lineTo(pts[n-1][0], pts[n-1][1]); }
}
function sub(pts, step, closed) {
  const out = [], n = pts.length;
  for (let i = 0; i < (closed ? n : n - 1); i++) { const a = pts[i], b = pts[(i + 1) % n];
    const k = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]); }
  if (!closed) out.push(pts[n - 1]);
  return out;
}
const wobble = (pts, amp, sd) => pts.map((p, i) => [p[0] + wob(i, sd) * amp * 2, p[1] + wob(i, sd + 50) * amp * 2]);
function bbox(p) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const q of p) { a = Math.min(a, q[0]); b = Math.min(b, q[1]); c = Math.max(c, q[0]); d = Math.max(d, q[1]); } return [a, b, c, d]; }
function hatch(c, b, col, sp, ang, lw, sd, al) {
  const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, R = Math.hypot(b[2] - b[0], b[3] - b[1]) / 2;
  c.save(); c.translate(cx, cy); c.rotate(ang); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.globalAlpha = al;
  c.beginPath(); for (let y = -R, i = 0; y < R; y += sp, i++) { const j = wob(i, sd + 7) * sp * .6; c.moveTo(-R, y + j); c.lineTo(R, y + j + wob(i, sd + 9) * sp * .8); }
  c.stroke(); c.restore();
}
function shape(c, pts, o = {}) {
  const closed = o.closed !== false, amp = o.amp ?? 2, sd = (SC += 7.7), base = sub(pts, o.step || 30, closed);
  if (o.fill) {
    const Pp = wobble(base, amp, sd); trace(c, Pp, closed); c.globalAlpha = o.alpha ?? .85; c.fillStyle = o.fill; c.fill();
    if (o.hatch) { c.save(); trace(c, Pp, closed); c.clip(); const b = bbox(Pp);
      hatch(c, b, o.hatch, o.sp || 9, o.ang ?? -.6, o.hw || 5, sd, .42);
      if (o.hatch2) hatch(c, b, o.hatch2, (o.sp || 9) * 1.6, (o.ang ?? -.6) + 1.4, o.hw || 5, sd + 3, .3);
      c.restore(); }
  }
  if (o.line) { c.strokeStyle = o.line; c.lineCap = c.lineJoin = 'round';
    for (let p = 0; p < 2; p++) { const Q = wobble(base, amp * (1 + p * .7), sd + 11 + p * 17); trace(c, Q, closed);
      c.globalAlpha = p ? .45 : .85; c.lineWidth = (o.lw || 4) * (p ? .75 : 1); c.stroke(); } }
  c.globalAlpha = 1;
}
function ln(c, pts, col, w, amp = 1.6, alpha = .85) {
  const sd = (SC += 5.1), base = sub(pts, 26, false);
  for (let p = 0; p < 2; p++) { const Q = wobble(base, amp * (1 + p * .6), sd + p * 13); trace(c, Q, false);
    c.strokeStyle = col; c.lineCap = c.lineJoin = 'round'; c.globalAlpha = p ? alpha * .5 : alpha; c.lineWidth = w * (p ? .8 : 1); c.stroke(); }
  c.globalAlpha = 1;
}
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function ell(cx, cy, rx, ry, n = 14, rot = 0) {
  const o = [], cs = Math.cos(rot), sn = Math.sin(rot);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * cs - y * sn, cy + x * sn + y * cs]); }
  return o;
}

/* ------------------------------------------------------------------ STATIC LAYERS (cached, 3 "boil" variants) */
const GLASS = [56, 124, 146, 252];
function drawBG(c) {
  SC = 0;
  shape(c, rect(-30, -30, W + 60, 580), { fill: '#2c3a6b', hatch: '#1b2550', hatch2: '#4a5a96', sp: 11, amp: 0, step: 50, alpha: .92 });
  c.save(); c.globalCompositeOperation = 'destination-out'; c.fillStyle = '#000'; c.fillRect(GLASS[0], GLASS[1], GLASS[2], GLASS[3]); c.restore();
  // floor + boards
  shape(c, rect(-30, 538, W + 60, 220), { fill: '#6a3f35', hatch: '#4a2a28', hatch2: '#8a5545', sp: 12, ang: .05, amp: 0, step: 50 });
  for (let i = 0; i < 14; i++) ln(c, [[W / 2 + (i - 6.5) * 60, 546], [W / 2 + (i - 6.5) * 190, 720]], '#3a2020', 3, 1.5, .6);
  shape(c, rect(-20, 524, W + 40, 22), { fill: '#d9c9a0', line: '#4a3a2a', lw: 4, amp: 1, step: 80 });
  // rug
  shape(c, ell(640, 668, 620, 90, 28), { fill: '#8a2f45', hatch: '#5a1830', hatch2: '#c04a62', sp: 8, line: '#e8b04a', lw: 6, amp: 3 });
  shape(c, ell(640, 668, 540, 66, 28), { line: '#e8b04a', lw: 3, amp: 3 });
  // window
  shape(c, rect(46, 114, 166, 272), { line: '#efe2b8', lw: 12, amp: 1.2, step: 60 });
  ln(c, [[129, 124], [129, 376]], '#efe2b8', 8); ln(c, [[56, 250], [202, 250]], '#efe2b8', 8);
  shape(c, rect(34, 382, 190, 16), { fill: '#d9c9a0', line: '#4a3a2a', lw: 4, amp: 1, step: 60 });
  const cur1 = [[20, 100], [78, 100], [66, 210], [84, 330], [40, 400], [20, 400]];
  shape(c, cur1, { fill: '#a63d4f', hatch: '#6e1f35', hatch2: '#d46a7a', sp: 7, ang: 1.45, line: '#3a0f1c', lw: 4 });
  shape(c, cur1.map(p => [258 - p[0], p[1]]), { fill: '#a63d4f', hatch: '#6e1f35', hatch2: '#d46a7a', sp: 7, ang: 1.45, line: '#3a0f1c', lw: 4 });
  ln(c, [[10, 96], [250, 96]], '#d9c9a0', 8);
  // piano cabinet
  shape(c, rect(250, 110, 780, 456), { fill: '#7a4a32', hatch: '#4f2c1f', hatch2: '#a8704a', sp: 9, line: '#2a160f', lw: 6, amp: 1.5, step: 80 });
  shape(c, rect(232, 88, 816, 36), { fill: '#8d5a3e', hatch: '#5a3320', hatch2: '#b9825a', sp: 8, line: '#2a160f', lw: 6, amp: 1.5, step: 80 });
  shape(c, rect(285, 170, 140, 340), { fill: '#6b3f2a', hatch: '#45251a', sp: 10, line: '#2a160f', lw: 4, amp: 1.5, step: 70 });
  shape(c, rect(855, 170, 140, 340), { fill: '#6b3f2a', hatch: '#45251a', sp: 10, line: '#2a160f', lw: 4, amp: 1.5, step: 70 });
  for (const x of [300, 980]) { shape(c, rect(x - 8, 36, 16, 52), { fill: '#f3e6c0', hatch: '#d6c48a', line: '#6a5a30', lw: 3, amp: .8 });
    shape(c, rect(x - 20, 82, 40, 8), { fill: '#c9a24a', line: '#5a3a12', lw: 3, amp: .8 }); }
  // lamp
  ln(c, [[1140, 318], [1140, 540]], '#3a2a22', 8, 1);
  shape(c, ell(1140, 546, 42, 10, 12), { fill: '#3a2a22', line: '#140a06', lw: 3, amp: 1 });
  shape(c, [[1096, 318], [1184, 318], [1168, 246], [1112, 246]], { fill: '#e9b45a', hatch: '#c98a2a', hatch2: '#ffe08a', sp: 7, line: '#5a3a12', lw: 4, amp: 1.2 });
  // plant
  for (const a of [-1.05, -.55, 0, .55, 1.05]) shape(c, ell(1220 + 40 * Math.sin(a), 480 - 40 * Math.cos(a), 13, 40, 10, a),
    { fill: '#2f8a4f', hatch: '#1b5a32', hatch2: '#5ac27a', sp: 6, line: '#0f3a20', lw: 3, amp: 1 });
  shape(c, [[1190, 480], [1250, 480], [1240, 546], [1200, 546]], { fill: '#c06a3f', hatch: '#8a4020', hatch2: '#e09a6a', sp: 7, line: '#4a2010', lw: 4, amp: 1 });
}
function drawFG(c) {
  SC = 100;
  shape(c, rect(246, 552, 788, 16), { fill: '#3a2418', line: '#140a06', lw: 4, amp: 1, step: 100 });
