<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grok Bot Promo 10s</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:min(100vw,177.78vh);height:auto;margin:auto;position:absolute;inset:0;top:50%;transform:translateY(-50%)}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
(() => {
const W = 1280, H = 720, FPS = 30, DUR = 10;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (T, a, b) => cl((T - a) / (b - a));
const sm = t => { t = cl(t); return t * t * (3 - 2 * t); };
const eo = t => 1 - Math.pow(1 - cl(t), 3);
const back = t => { t = cl(t); const s = 1.7; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const FONT = '"Segoe UI",system-ui,-apple-system,Arial,sans-serif';
const GOLD = '#f5b942';

const BOTS = [
  { n: 'Inbox Manager', col: '#ff4d3d' }, { n: 'X Radar', col: '#f4f4f6' }, { n: 'Meta Ads', col: '#8b7bff' },
  { n: 'Project Lead', col: '#35c2a1' }, { n: 'Chief of Staff', col: GOLD }];

function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, col = '#fff', weight = 600, align = 'left', a = 1) {
  c.globalAlpha = a; c.font = `${weight} ${size}px ${FONT}`; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); c.globalAlpha = 1;
}
function blob(x, y, s, col, T, seed = 0, look = 0, sq = 1) {
  s = Math.max(.01, s); if (s < .5) return;
  c.save(); c.translate(x, y); c.scale(1, sq);
  c.fillStyle = col; c.translate(0, s * .05);
  c.beginPath(); c.arc(0, 0, s, 0, Math.PI * 2); c.fill();   // perfectly round body
  // flat disc; eyes = two tilted pills pushed to the upper right (measured from the reference image)
  const bl = ((T + seed * 1.7) % 3.4) < .12 ? .15 : 1;
  c.fillStyle = '#15151b';
  for (const [ex, ey] of [[.09, -.33], [.58, -.54]]) { c.save(); c.translate((ex + look * .06) * s, ey * s); c.rotate(-.64);
    const hw = .095 * s, hh = .23 * s * bl; c.beginPath(); c.roundRect(-hw, -hh, 2 * hw, 2 * hh, hw); c.fill(); c.restore(); }
  c.restore();
}
function caption(T, a, b, line1, line2) {
  const k = Math.min(sm((T - a) / .35), sm((b - T) / .25));
  if (k <= 0) return;
  c.save(); c.translate(0, (1 - k) * 14);
  txt(line1, W / 2, 626, 46, '#fff', 700, 'center', k);
  if (line2) txt(line2, W / 2, 668, 24, '#9a9aa6', 500, 'center', k);
  c.restore();
}
function bg(T) {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0c0c10'); g.addColorStop(1, '#17171d');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const r = c.createRadialGradient(W / 2 + Math.sin(T * .6) * 80, 300, 0, W / 2, 300, 620);
  r.addColorStop(0, 'rgba(245,185,66,.10)'); r.addColorStop(1, 'rgba(245,185,66,0)'); c.fillStyle = r; c.fillRect(0, 0, W, H);
}
function card(x, y, w, h, fill = '#1d1d24', stroke = '#2c2c36') { rr(x, y, w, h, 22); c.fillStyle = fill; c.fill(); c.lineWidth = 2; c.strokeStyle = stroke; c.stroke(); }

/* ---------------- scenes (t = local time from 0) ---------------- */
function sceneHome(t, T) {
  txt('Grok Bot', 70, 90, 34, '#fff', 700);
  const xs = BOTS.map((_, i) => 320 + i * 160);
  // golden frame draws itself around the five bots
  const fp = eo((t - .9) / 1.0), per = 2 * (760 + 240);
  rr(240, 200, 800, 240, 44); c.setLineDash([per * fp, per]); c.lineDashOffset = 0; c.lineWidth = 5; c.strokeStyle = GOLD; c.shadowColor = GOLD; c.shadowBlur = 24 * fp; c.stroke();
  c.setLineDash([]); c.shadowBlur = 0;
  BOTS.forEach((b, i) => {
    const k = back((t - .15 - i * .12) / .5), by = 320 + Math.sin(T * 2 + i) * 4;
    c.save(); c.globalAlpha = cl(k * 2);
    blob(xs[i], by, 52 * k, b.col, T, i, 0, 1 + Math.sin(T * 3 + i) * .015);
    txt(b.n, xs[i], 408, 17, '#d8d8e0', 600, 'center', cl(k * 2)); c.restore();
  });
  txt('Your AI employees', W / 2, 505, 52, '#fff', 800, 'center', sm((t - 1.1) / .4));
  txt('inside Grok Bot.', W / 2, 565, 52, GOLD, 800, 'center', sm((t - 1.3) / .4));
}
function sceneAsk(t, T) {
  card(190, 110, 900, 440);
  blob(260, 190, 28, BOTS[0].col, T, 0, 0); txt('Inbox Manager', 306, 188, 24, '#fff', 700); txt('online', 306, 214, 16, '#4ade80', 500);
  c.fillStyle = '#2c2c36'; c.fillRect(190, 240, 900, 2);
  // user bubble after send
  const sent = seg(t, 1.25, 1.55), q = 'Ask one to sort my inbox and draft replies.';
  if (sent > 0) { const w = 560; c.save(); c.translate(0, (1 - eo(sent)) * 60); c.globalAlpha = sent; rr(1060 - w, 280, w, 62, 26); c.fillStyle = BOTS[0].col; c.fill(); txt(q, 1060 - w + 26, 320, 24, '#15151b', 600); c.restore(); }
  // input bar
  rr(220, 470, 780, 60, 30); c.fillStyle = '#26262f'; c.fill();
  const typed = sent > 0 ? '' : q.slice(0, Math.floor(seg(t, .25, 1.15) * q.length));
  if (typed) txt(typed + (Math.floor(t * 3) % 2 ? '|' : ''), 250, 509, 24, '#f4f4f6', 500); else if (!sent) txt('Message Inbox Manager', 250, 509, 24, '#6c6c7a', 500);
  const pulse = 1 + (t > 1.1 && t < 1.4 ? .18 * Math.sin((t - 1.1) / .3 * Math.PI) : 0);
  c.save(); c.translate(965, 500); c.scale(pulse, pulse); c.beginPath(); c.arc(0, 0, 22, 0, 7); c.fillStyle = GOLD; c.fill();
  c.strokeStyle = '#15151b'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, 8); c.lineTo(0, -8); c.moveTo(-8, 0); c.lineTo(0, -9); c.lineTo(8, 0); c.stroke(); c.restore();
}
function sceneRun(t, T) {
  card(290, 120, 700, 420);
  blob(640, 230, 56, BOTS[0].col, T, 0, 0, 1 + Math.sin(T * 9) * .035);
  txt('Inbox Manager is working…', W / 2, 330, 28, '#fff', 700, 'center');
  const rows = ['Reading 47 new emails', 'Sorting by sender & urgency', 'Drafting replies'];
  rows.forEach((r, i) => {
    const st = .3 + i * .35, done = t > st + .45, k = sm((t - st) / .25), y = 385 + i * 44;
    c.globalAlpha = k; c.save(); c.translate(0, (1 - k) * 10);
    c.beginPath(); c.arc(360, y - 8, 12, 0, 7);
    if (done) { c.fillStyle = '#4ade80'; c.fill(); c.strokeStyle = '#0c0c10'; c.lineWidth = 3; c.beginPath(); c.moveTo(354, y - 8); c.lineTo(359, y - 3); c.lineTo(367, y - 14); c.stroke(); }
    else { c.strokeStyle = GOLD; c.lineWidth = 3; c.beginPath(); c.arc(360, y - 8, 12, T * 8, T * 8 + 4); c.stroke(); }
    txt(r, 392, y, 24, done ? '#9a9aa6' : '#fff', 600); c.restore(); c.globalAlpha = 1;
  });
  rr(360, 510, 560, 8, 4); c.fillStyle = '#2c2c36'; c.fill(); rr(360, 510, 560 * eo(t / 1.3), 8, 4); c.fillStyle = GOLD; c.fill();
}
function sceneResult(t, T) {
  const groups = [['Urgent', 3, '#ff4d3d'], ['Clients', 5, GOLD], ['Newsletters', 12, '#8b7bff']];
  groups.forEach((g, i) => {
    const k = back((t - i * .15) / .45), y = 130 + i * 128;
    c.save(); c.globalAlpha = cl(k * 2); c.translate((1 - k) * -60, 0); card(120, y, 420, 108);
    c.beginPath(); c.arc(175, y + 54, 16, 0, 7); c.fillStyle = g[2]; c.fill();
    txt(g[0], 210, y + 50, 28, '#fff', 700); txt('emails grouped', 210, y + 82, 18, '#8a8a97', 500); txt(String(g[1]), 500, y + 66, 52, g[2], 800, 'right'); c.restore();
  });
  const k = back((t - .5) / .55);
  c.save(); c.globalAlpha = cl(k * 2); c.translate((1 - k) * 60, 0); card(600, 130, 560, 380);
  blob(650, 190, 26, BOTS[0].col, T, 0, 0); txt('Draft reply', 692, 198, 26, '#fff', 700);
  const lines = ['Hi Sam — thanks for the update.', 'Tuesday works for the review call.', 'I’ll send the revised numbers today.'];
  lines.forEach((l, i) => { const w = seg(t, .9 + i * .25, 1.3 + i * .25); txt(l.slice(0, Math.floor(w * l.length)), 635, 270 + i * 44, 22, '#e6e6ee', 500); });
  const bk = back((t - 1.5) / .4); c.save(); c.translate(635, 450); c.scale(bk, bk);
  rr(0, -32, 230, 50, 25); c.fillStyle = 'rgba(245,185,66,.18)'; c.fill(); c.lineWidth = 2; c.strokeStyle = GOLD; c.stroke();
  txt('✓  Not sent', 28, 2, 24, GOLD, 800); c.restore(); c.restore();
}
function sceneRadar(t, T) {
  card(250, 120, 780, 420);
  blob(320, 205, 34, BOTS[1].col, T, 1, 0, 1 + Math.sin(T * 5) * .02); txt('X Radar', 372, 200, 30, '#fff', 700); txt('Today’s signal', 372, 228, 18, '#8a8a97', 500);
  const items = ['Tesla FSD update is trending', 'New open-source model just dropped', 'A competitor posted a pricing change'];
  items.forEach((s, i) => { const k = back((t - .25 - i * .18) / .45), y = 270 + i * 66;
    c.save(); c.globalAlpha = cl(k * 2); c.translate((1 - k) * 50, 0); rr(290, y, 700, 52, 16); c.fillStyle = '#26262f'; c.fill();
    c.beginPath(); c.arc(318, y + 26, 7, 0, 7); c.fillStyle = GOLD; c.fill(); txt(s, 340, y + 34, 22, '#f4f4f6', 600); c.restore(); });
  const kk = back((t - .95) / .4); c.save(); c.translate(820, 495); c.scale(kk, kk); rr(-70, -26, 270, 48, 24); c.fillStyle = GOLD; c.fill(); txt('Plus four more', 65, 8, 22, '#15151b', 800, 'center'); c.restore();
}
function sceneEnd(t, T) {
  BOTS.forEach((b, i) => { const k = back((t - i * .08) / .5), x = 320 + i * 160, y = 250 + Math.sin(T * 3 + i) * 6 - (1 - k) * 40;
    c.globalAlpha = cl(k * 2); blob(x, y, 46 * k, b.col, T, i, 0); c.globalAlpha = 1; });
  txt('Grok Bot', W / 2, 440, 96, '#fff', 800, 'center', sm((t - .3) / .4));
  txt('Your AI team, in one app.', W / 2, 505, 34, GOLD, 600, 'center', sm((t - .55) / .4));
}

const SCENES = [[0, 2.5, sceneHome, null, null], [2.5, 4.1, sceneAsk, 'Just ask in plain words.', null],
  [4.1, 5.5, sceneRun, 'Then it gets to work.', null], [5.5, 7.6, sceneResult, 'Drafts a reply, but never sends.', 'You stay in control.'],
  [7.6, 8.9, sceneRadar, 'Four more bots on the case.', null], [8.9, 10.01, sceneEnd, null, null]];

function draw(T) {
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; bg(T);
  for (const [a, b, fn, l1, l2] of SCENES) {
    if (T < a || T >= b) continue;
    const fi = a === 0 ? 1 : sm((T - a) / .22), fo = b >= DUR ? 1 : sm((b - T) / .2), al = Math.min(fi, fo);
    c.save(); c.globalAlpha = al; c.translate(0, (1 - al) * 14);
    const z = 1 + .03 * ((T - a) / (b - a)); c.translate(W / 2, H / 2 - 40); c.scale(z, z); c.translate(-W / 2, -H / 2 + 40);
    fn(T - a, T); c.restore();
    if (l1) caption(T, a + .2, b - .05, l1, l2);
  }
  if (T < .4) { c.fillStyle = `rgba(0,0,0,${1 - T / .4})`; c.fillRect(0, 0, W, H); }
}

const params = new URLSearchParams(location.search);
if (params.get('export')) {
  (async () => {
    const n = FPS * DUR;
    for (let i = 0; i < n; i++) {
      draw(i / FPS);
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      await fetch('/frame/' + String(i).padStart(4, '0'), { method: 'POST', body: blob });
    }
    await fetch('/done', { method: 'POST' }); document.title = 'EXPORT DONE';
  })();
} else if (params.get('t')) {
  draw(parseFloat(params.get('t')));
} else {
  const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % (DUR + .6)); requestAnimationFrame(loop); })();
}
})();
</script>
</body>
</html>
