<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grok Bot - 3 min</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:min(100vw,177.78vh);height:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
window.addEventListener('error', e => { document.title = 'ERR ' + e.message + ' L' + e.lineno; });
window.addEventListener('unhandledrejection', e => { document.title = 'REJ ' + (e.reason && e.reason.message); });
(() => {
const W = 1280, H = 720, FPS = 30;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = t => { t = cl(t); return t * t * (3 - 2 * t); };
const eo = t => 1 - Math.pow(1 - cl(t), 3);
const back = t => { t = cl(t); const s = 1.7; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const hh = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };
const FONT = '"Segoe UI",system-ui,-apple-system,Arial,sans-serif';
const GOLD = '#f5b942', INK = '#15151b', MUTED = '#9a9aa6', GREY = '#3a3a48';
const COL = { inbox: '#ff4d3d', x: '#f4f4f6', meta: '#8b7bff', goog: '#4da3ff', proj: '#35c2a1', chief: GOLD };

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, col = '#fff', weight = 600, align = 'left', a = 1) {
  c.globalAlpha = a; c.font = `${weight} ${size}px ${FONT}`; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'alphabetic'; c.fillText(s, x, y); c.globalAlpha = 1;
}
const tw = (s, size, weight = 600) => { c.font = `${weight} ${size}px ${FONT}`; return c.measureText(s).width; };
function star(x, y, r, col) { c.fillStyle = col; c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr_ = i % 2 ? r * .45 : r; c.lineTo(x + Math.cos(a) * rr_, y + Math.sin(a) * rr_); } c.closePath(); c.fill(); }
function blob(x, y, s, col, T, seed = 0, look = 0, sq = 1, badge = false) {
  s = Math.max(.01, s); if (s < .5) return;
  c.save(); c.translate(x, y); c.scale(1, sq); c.fillStyle = col;
  c.beginPath(); c.arc(0, 0, s, 0, Math.PI * 2); c.fill();
  const bl = ((T + seed * 1.7) % 3.4) < .12 ? .15 : 1; c.fillStyle = INK;
  for (const [ex, ey] of [[.09, -.33], [.58, -.54]]) { c.save(); c.translate((ex + look * .06) * s, ey * s); c.rotate(-.64);
    const hw = .095 * s, hgt = .23 * s * bl; c.beginPath(); c.roundRect(-hw, -hgt, 2 * hw, 2 * hgt, hw); c.fill(); c.restore(); }
  if (badge) { const bx = .74 * s, by = .74 * s, br = .3 * s; c.beginPath(); c.arc(bx, by, br + s * .06, 0, 7); c.fillStyle = '#1d1d24'; c.fill(); c.beginPath(); c.arc(bx, by, br, 0, 7); c.fillStyle = '#f59e0b'; c.fill(); star(bx, by, br * .6, '#fff'); }
  c.restore();
}
function card(x, y, w, h, fill = '#1d1d24', stroke = '#2c2c36', r = 22) { rr(x, y, w, h, r); c.fillStyle = fill; c.fill(); c.lineWidth = 2; c.strokeStyle = stroke; c.stroke(); }
function bubble(x, y, s, fill, tcol, size = 22, align = 'left', a = 1) {
  const w = tw(s, size) + 40, h = size + 26, x0 = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  c.globalAlpha = a; rr(x0, y, w, h, h / 2); c.fillStyle = fill; c.fill(); txt(s, x0 + 20, y + h / 2 + size * .35, size, tcol, 600, 'left', 1); c.globalAlpha = 1; return w;
}
function check(x, y, r, col = '#4ade80') { c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = col; c.fill(); c.strokeStyle = '#0c0c10'; c.lineWidth = r * .22; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(x - r * .4, y); c.lineTo(x - r * .1, y + r * .32); c.lineTo(x + r * .45, y - r * .32); c.stroke(); }
function spinner(x, y, r, T, col = GOLD) { c.strokeStyle = col; c.lineWidth = r * .25; c.lineCap = 'round'; c.beginPath(); c.arc(x, y, r, T * 8, T * 8 + 4); c.stroke(); }
function wrap(s, maxW, size, weight = 600) { const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (tw(t, size, weight) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } lines.push(cur); return lines; }
function arrowDots(x1, y1, x2, y2, T, col = GOLD, n = 3, spd = .7) {
  for (let i = 0; i < n; i++) { const k = ((T * spd + i / n) % 1), x = lerp(x1, x2, k), y = lerp(y1, y2, k);
    c.globalAlpha = Math.sin(k * Math.PI); c.fillStyle = col; c.beginPath(); c.arc(x, y, 6, 0, 7); c.fill(); c.globalAlpha = 1; }
}
function line(x1, y1, x2, y2, p, col = GREY, w = 3, dash = null) { if (p <= 0) return; c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; if (dash) c.setLineDash(dash);
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(lerp(x1, x2, cl(p)), lerp(y1, y2, cl(p))); c.stroke(); c.setLineDash([]); }
function bg(T) {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0c0c10'); g.addColorStop(1, '#17171d'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const r = c.createRadialGradient(W / 2 + Math.sin(T * .35) * 120, 300, 0, W / 2, 300, 640); r.addColorStop(0, 'rgba(245,185,66,.09)'); r.addColorStop(1, 'rgba(245,185,66,0)'); c.fillStyle = r; c.fillRect(0, 0, W, H);
}
// headline that swaps in exact sync with the spoken phrase: items = [[text, time, color?], ...]
function head(t, items) {
  let idx = -1; items.forEach((it, i) => { if (t >= it[1]) idx = i; }); if (idx < 0) return;
  const cur = items[idx], k = sm((t - cur[1]) / .4);
  if (idx > 0 && k < 1) txt(items[idx - 1][0], W / 2, 92 - 26 * k, 46, items[idx - 1][2] || '#fff', 800, 'center', 1 - k);
  c.save(); c.translate(0, (1 - k) * 22); txt(cur[0], W / 2, 92, 46, cur[2] || '#fff', 800, 'center', k); c.restore();
}
const pop = (t, at, d = .45) => back((t - at) / d);
const appear = (t, at, d = .35) => sm((t - at) / d);

/* ---------- scenes: fn(t, q, T, D)   t = local time, q(lineIndex, 'word') = local time that word is spoken ---------- */
function sIntro(t, q, T) {
  head(t, [['Grok Bot', q(0, 'Grok') - .1], ['What makes it different', q(1, 'different')]]);
  const k = pop(t, q(0, 'Grok') - .2, .6), shift = sm((t - q(1, 'different')) / .8);
  c.save(); c.translate(0, -50 * shift); c.globalAlpha = cl(k * 2);
  if (t > q(1, 'different')) { c.strokeStyle = GOLD; c.lineWidth = 4; c.shadowColor = GOLD; c.shadowBlur = 24 * shift; c.globalAlpha = shift; c.beginPath(); c.arc(640, 300, 110, 0, 7); c.stroke(); c.shadowBlur = 0; c.globalAlpha = cl(k * 2); }
  blob(640, 300, 82 * k, COL.x, T, 1, 0, 1 + Math.sin(T * 2) * .012, true);
  txt('Grok Bot', 640, 478, 64, '#fff', 800, 'center', appear(t, q(0, 'Grok') + .1)); c.restore();
  const t0 = q(1, 'every'), names = ['Agent', 'Agent', 'Agent', 'Agent', 'Agent', 'Agent'];
  names.forEach((n, i) => { const kk = pop(t, t0 + i * .18, .4), x = 340 + i * 120; if (kk <= 0) return;
    c.save(); c.globalAlpha = cl(kk * 2) * .85; c.translate(x, 540); c.scale(kk, kk); rr(-34, -34, 68, 68, 20); c.fillStyle = '#23232b'; c.fill(); c.strokeStyle = GREY; c.lineWidth = 2; c.stroke();
    c.fillStyle = MUTED; for (const ex of [-10, 10]) { c.beginPath(); c.arc(ex, -4, 5, 0, 7); c.fill(); } c.restore(); });
  if (t > t0) txt('other personal agents', 640, 600, 20, MUTED, 600, 'center', appear(t, t0 + 1.0));
}
function person(x, y, col = '#d8d8e0') { c.fillStyle = col; c.beginPath(); c.arc(x, y - 14, 15, 0, 7); c.fill(); c.beginPath(); c.arc(x, y + 30, 28, Math.PI, 0); c.fill(); }
function agentIcon(x, y, T, col = '#c9c9d3') { c.save(); c.translate(x, y); rr(-34, -34, 68, 68, 20); c.fillStyle = '#23232b'; c.fill(); c.strokeStyle = col; c.lineWidth = 3; c.stroke(); c.fillStyle = col; for (const ex of [-10, 10]) { c.beginPath(); c.arc(ex, -2, 5, 0, 7); c.fill(); } c.restore(); }
function sThreads(t, q, T) {
  head(t, [['A lot of personal agents', .3], ['Convoluted & confusing', q(2, 'convoluted'), '#ff8a65']]);
  const you = pop(t, q(0, 'You') - .1), ag = pop(t, q(0, 'one'));
  if (you > 0) { c.save(); c.globalAlpha = cl(you * 2); person(170, 330); txt('You', 170, 410, 22, MUTED, 600, 'center'); c.restore(); }
  line(205, 330, 395, 330, (t - q(0, 'talk')) / .7, GOLD, 4);
  if (ag > 0) { c.save(); c.globalAlpha = cl(ag * 2); c.translate(430, 330); c.scale(ag, ag); c.translate(-430, -330); agentIcon(430, 330, T); c.restore(); txt('One agent', 430, 395, 22, MUTED, 600, 'center', cl(ag * 2)); }
  // threads / channels spawn, then everything funnels back into one conversation
  const tq = q(1, 'threads'), cq = q(1, 'channels'), sq = q(1, 'single'), merge = sm((t - sq) / .9);
  const boxes = [[700, 215, 'Thread', tq], [700, 325, 'Thread', tq + .25], [700, 435, 'Thread', tq + .5], [880, 270, 'Channel', cq], [880, 380, 'Channel', cq + .3]];
  boxes.forEach(([x, y, lab, at]) => { const k = pop(t, at, .4); if (k <= 0) return; const a = (1 - merge);
    line(465, 330, x - 70, y, (t - at) / .4, GREY, 3);
    c.save(); c.globalAlpha = cl(k * 2) * a; c.translate(x, y); c.scale(k, k); rr(-62, -28, 124, 56, 14); c.fillStyle = '#23232b'; c.fill(); c.strokeStyle = GREY; c.lineWidth = 2; c.stroke(); txt(lab, 0, 8, 20, '#d8d8e0', 600, 'center'); c.restore(); });
  // the single big thread box
  const bk = pop(t, sq + .3, .5);
  if (bk > 0) {
    const shake = t > q(2, 'convoluted') ? Math.sin(T * 30) * 1.5 : 0;
    c.save(); c.globalAlpha = cl(bk * 2); c.translate(0, 0);
    line(465, 330, 640, 330, 1, GOLD, 4);
    card(640 + shake, 180, 440, 300); txt('One thread', 662 + shake, 214, 20, MUTED, 600);
    const msgs = [['Ads report?', COL.meta, q(2, 'ads')], ['Reply to Sam', COL.inbox, q(2, 'email')], ['Project status', COL.proj, q(2, 'projects')],
      ['Invoice #204', GOLD, q(2, 'once')], ['Hiring plan', COL.goog, q(2, 'once') + .25], ['New ad idea', COL.meta, q(2, 'once') + .5]];
    const chaos = sm((t - q(2, 'convoluted')) / 1.2), pts = [];
    msgs.forEach((m, i) => { const ap = pop(t, m[2], .35); if (ap <= 0) return; const w = tw(m[0], 19) + 30,
      nx = 665 + (i % 2) * 150, ny = 240 + Math.floor(i / 2) * 76 + (i % 2) * 34, cx = 860 + (hh(i * 3.1) - .5) * 300, cy = 340 + (hh(i * 5.7) - .5) * 200,
      x = lerp(nx, cx - w / 2, chaos) + Math.sin(T * 7 + i) * 3 * chaos, y = lerp(ny, cy, chaos) + Math.cos(T * 6 + i) * 3 * chaos; pts.push([x + w / 2, y + 16]);
      c.save(); c.translate(x + w / 2, y + 16); c.rotate(chaos * (hh(i * 9.1) - .5) * .7); c.scale(ap, ap); rr(-w / 2, -16, w, 32, 16); c.fillStyle = m[1]; c.fill();
      txt(m[0], 0, 6, 19, m[1] === GOLD || m[1] === COL.proj ? INK : '#fff', 600, 'center'); c.restore(); });
    if (chaos > 0) { c.strokeStyle = 'rgba(255,138,101,.65)'; c.lineWidth = 2.5; for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) if ((i + j) % 2 === 0) { c.globalAlpha = chaos; c.beginPath(); c.moveTo(pts[i][0], pts[i][1]);
      c.bezierCurveTo(pts[i][0] + 60, pts[j][1], pts[j][0] - 60, pts[i][1], pts[j][0], pts[j][1]); c.stroke(); } c.globalAlpha = 1; }
    c.restore();
  }
}
function sTeam(t, q, T) {
  head(t, [['With Grok Bot', q(0, 'With') - .1], ['A separate bot for every job', q(0, 'separate')]]);
  const names = ['Inbox Manager', 'X Radar', 'Meta Ads', 'Project Lead', 'Chief of Staff'], cols = [COL.inbox, COL.x, COL.meta, COL.proj, COL.chief], roles = ['mail', 'news', 'ads', 'tasks', 'delegates'];
  const fp = eo((t - q(1, 'whole')) / 1.0), per = 2 * (760 + 240), y0 = 300;
  if (fp > 0) { rr(240, y0 - 130, 800, 280, 44); c.setLineDash([per * fp, per]); c.lineWidth = 5; c.strokeStyle = GOLD; c.shadowColor = GOLD; c.shadowBlur = 24 * fp; c.stroke(); c.setLineDash([]); c.shadowBlur = 0; }
  cols.forEach((col, i) => { const x = 320 + i * 160, at = q(0, 'separate') + .15 + i * .3, k = pop(t, at, .5); if (k <= 0) return;
    c.globalAlpha = cl(k * 2); blob(x, y0 + Math.sin(T * 2 + i) * 4, 52 * k, col, T, i, 0); c.globalAlpha = 1;
    const nk = appear(t, q(2, 'role') + i * .22); txt(names[i], x, y0 + 88, 19, '#e6e6ee', 700, 'center', nk); txt(roles[i], x, y0 + 112, 16, MUTED, 500, 'center', nk); });
  const k1 = appear(t, q(1, 'assistant')); const k2 = appear(t, q(1, 'team'));
  txt('not one assistant', W / 2, 520, 34, MUTED, 600, 'center', k1 * (1 - k2)); txt('a whole team of bots', W / 2, 520, 40, GOLD, 800, 'center', k2);
}
function sDefine(t, q, T) {
  head(t, [['Define the roles', q(0, 'Creating') - .1]]);
  const ck = pop(t, .3, .6); c.save(); c.globalAlpha = cl(ck * 2); c.translate(640, 350); c.scale(.92 + .08 * ck, .92 + .08 * ck); c.translate(-640, -350);
  card(330, 125, 620, 440, '#f3f3f6', '#cfcfd8', 26); txt('Create new bot', 640, 170, 22, '#15151b', 800, 'center');
  const colsA = ['#8b7bff', '#ffb347', '#ff6b4a', '#35c2a1', '#4da3ff', '#ff7aa8', '#f5b942', '#a0e060'], sel = t > q(0, 'avatar') + .5 ? 3 : -1;
  blob(640, 245, 46, sel >= 0 ? colsA[sel] : '#c9c9d3', T, 3, 0);
  txt('Name', 370, 330, 16, '#6c6c7a', 700); rr(370, 340, 540, 44, 12); c.fillStyle = '#e4e4ea'; c.fill();
  const nm = 'Security Bot', np = cl((t - q(0, 'name')) / (q(0, 'pick') - q(0, 'name') - .1)); txt(nm.slice(0, Math.floor(np * nm.length)) + (np > 0 && np < 1 && Math.floor(T * 3) % 2 ? '|' : ''), 386, 370, 22, '#15151b', 600);
  const ak = appear(t, q(0, 'pick')); c.globalAlpha = ak; colsA.forEach((col, i) => { const x = 392 + i * 68; c.beginPath(); c.arc(x, 432, 22 + (i === sel ? 4 : 0), 0, 7); c.fillStyle = col; c.fill(); if (i === sel) { c.strokeStyle = '#15151b'; c.lineWidth = 3; c.stroke(); } }); c.globalAlpha = 1;
  txt('Role', 370, 484, 16, '#6c6c7a', 700, 'left', ak); rr(370, 494, 540, 44, 12); c.fillStyle = '#e4e4ea'; c.fill();
  const rl = 'Watches for risky logins', rp = cl((t - q(0, 'define')) / 1.5); txt(rl.slice(0, Math.floor(rp * rl.length)), 386, 524, 22, '#15151b', 600);
  c.restore();
  const wk = appear(t, q(1, 'Whatever')); if (wk > 0) { c.save(); c.translate((1 - wk) * 30, 0); txt('whatever you want', 1110, 340, 28, GOLD, 700, 'center', wk); c.restore(); }
  const bk = pop(t, q(1, 'want') + .4, .5); if (bk > 0) { c.save(); c.translate(1110, 450); c.scale(bk, bk); blob(0, 0, 44, COL.proj, T, 5, 0); txt('Security Bot', 0, 76, 20, '#e6e6ee', 700, 'center'); c.restore(); }
}
function roleCard(x, y, col, name, rows, k, T, seed) {
  if (k <= 0) return; c.save(); c.globalAlpha = cl(k * 2); c.translate(x + 170, y + 130); c.scale(.85 + .15 * k, .85 + .15 * k); c.translate(-x - 170, -y - 130);
  card(x, y, 340, 280); blob(x + 64, y + 66, 36, col, T, seed, 0); txt(name, x + 118, y + 62, 25, '#fff', 700); txt('Handles', x + 118, y + 88, 17, MUTED, 500);
  c.fillStyle = '#2c2c36'; c.fillRect(x + 24, y + 126, 292, 2);
  rows.forEach((r, i) => { c.beginPath(); c.arc(x + 40, y + 168 + i * 50, 7, 0, 7); c.fillStyle = col; c.fill(); txt(r, x + 62, y + 176 + i * 50, 22, '#e6e6ee', 500); });
  c.restore();
}
function sRoles(t, q, T) {
  head(t, [['One bot, one job', q(0, 'Say')], ['Know who to ask', q(2, 'topic')], ['Segment the bots', q(3, 'Segmenting')]]);
  roleCard(70, 150, COL.meta, 'Meta Ads Bot', ['Campaign reports', 'Budget alerts'], pop(t, q(0, 'Meta'), .5), T, 1);
  roleCard(470, 150, COL.goog, 'Google Ads Manager', ['Search campaigns', 'Keyword changes'], pop(t, q(1, 'Google'), .5), T, 2);
  roleCard(870, 150, COL.proj, 'Project Manager', ['Tasks & deadlines', 'Weekly status'], pop(t, q(1, 'project'), .5), T, 3);
  const bq = q(2, 'topic'), bk = pop(t, bq, .4);
  if (bk > 0) { c.save(); c.translate(0, (1 - cl(bk)) * 20); bubble(120, 505, 'How is the Meta spend?', '#26262f', '#fff', 22, 'left', cl(bk)); c.restore(); }
  const hq = q(2, 'who'); if (t > hq) { const p = sm((t - hq) / .4); c.strokeStyle = COL.meta; c.lineWidth = 5; c.shadowColor = COL.meta; c.shadowBlur = 22 * p; rr(70, 150, 340, 280, 22); c.globalAlpha = p; c.stroke(); c.globalAlpha = 1; c.shadowBlur = 0; arrowDots(260, 505, 240, 430, T, COL.meta, 2, 1.2); }
  const rk = pop(t, q(2, 'talk') + .3, .4); if (rk > 0) { c.save(); c.translate(0, (1 - cl(rk)) * 16); bubble(430, 505, 'On track: 82% of budget used.', COL.meta, '#fff', 22, 'left', cl(rk)); c.restore(); }
  const sq = q(3, 'Segmenting'); [70, 470, 870].forEach((x, i) => { const k = pop(t, sq + .4 + i * .5, .4); if (k > 0) { c.save(); c.translate(x + 170, 460); c.scale(k, k); rr(-90, -20, 180, 40, 20); c.fillStyle = 'rgba(74,222,128,.15)'; c.fill(); c.strokeStyle = '#4ade80'; c.lineWidth = 2; c.stroke(); txt('✓ clean thread', 0, 7, 19, '#4ade80', 700, 'center'); c.restore(); } });
}
function sChief(t, q, T) {
  head(t, [['Chief of Staff', q(0, 'chief') - .2], ['It delegates', q(1, 'delegates')], ['One bot. A whole team.', q(2, 'one')]]);
  const cx = 640, cy = 330, others = [['Meta Ads', COL.meta, 300, 250], ['Google Ads', COL.goog, 980, 250], ['Projects', COL.proj, 300, 430], ['Inbox', COL.inbox, 980, 430]];
  const ck = pop(t, q(0, 'chief') - .1, .6);
  const pq = q(1, 'proactive'); if (t > pq) { const p = (T * 1.2) % 1; c.globalAlpha = (1 - p) * .6 * appear(t, pq); c.strokeStyle = GOLD; c.lineWidth = 4; c.beginPath(); c.arc(cx, cy, 70 + p * 50, 0, 7); c.stroke(); c.globalAlpha = 1; }
  const dq = q(1, 'delegates');
  others.forEach(([n, col, x, y], i) => { const k = pop(t, dq + i * .2, .5); line(cx, cy, x, y, (t - dq - i * .2) / .5, '#3a3a48', 3, [8, 8]);
    if (k > 0) { c.globalAlpha = cl(k * 2); blob(x, y, 40 * k, col, T, i + 1, 0); txt(n, x, y + 72, 20, '#d8d8e0', 600, 'center', cl(k * 2)); c.globalAlpha = 1; } });
  const uq = q(2, 'talk'), uk = pop(t, uq, .45);
  if (uk > 0) { c.save(); c.translate(0, (1 - cl(uk)) * 16); bubble(640, 480, 'Plan my launch week', '#26262f', '#fff', 24, 'center', cl(uk)); c.restore();
    others.forEach(([n, col, x, y], i) => { if (t > uq + .6) arrowDots(cx, cy, x, y, T + i * .3, GOLD, 3, .9); const dk = pop(t, q(2, 'whole') + i * .45, .4);
      if (t < q(2, 'whole') + i * .45) { if (t > uq + .6) spinner(x + 56, y - 28, 11, T); } else { c.save(); c.translate(x + 56, y - 28); c.scale(cl(dk), cl(dk)); check(0, 0, 14); c.restore(); } }); }
  blob(cx, cy, 62 * ck, COL.chief, T, 9, 0, 1 + Math.sin(T * 3) * .015);
